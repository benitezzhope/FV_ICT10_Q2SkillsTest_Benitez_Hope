<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>2Q Skills Test</title>

<style>
/* CSS Design */
    body{ 
        font-family: Verdana, Geneva, Tahoma, sans-serif; 
        background: url("https://i.pinimg.com/1200x/db/21/50/db21506e3d6a5a20c1ada5b109201fda.jpg");
        background-repeat: no-repeat;
        background-size: 120%;
    }
    #firstbox{
        background-color: rgb(255, 254, 254);
        width: 600px;
        height: 530px;
        margin-left: auto;
        margin-right: auto;
        margin-top: 100px;
        border-radius: 15px;
        text-align: center;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
    }
    input{
        width: 400px;
        height: 50px;
        border-radius: 20px;
        outline: none;
        border: none;
        text-align: left;
        padding-left: 20px;
        box-sizing: border-box;
        color: rgb(100, 97, 156);
        font-size: 15px;
        box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px; 
    }
    button{
        width: 200px;
        height: 50px;
        color: rgb(255, 255, 255);
        border: none;
        font-size: 20px;
        background-color: rgb(232, 172, 247);
        outline: none;
        border-radius: 15px;
        box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
    }
</style>
</head>

<body>
<div id="firstbox">
    <h1 style="padding-top: 30px; color: rgb(187, 141, 239); font-size: 30px;"><b>Nonmetal Elements</b></h1>

    <!--Instructions-->
    <p style="color: rgb(180, 180, 180);"><i>Enter a nonmetal's <b>SYMBOL</b> and find out more about it!</i></p>

    <br>

    <input type="text" id="nonmetal" placeholder="Example: H">
    <br><br>
    <button type="button" py-click="search_nm">Search Nonmetal</button>

    <br><br><br>

    <!-- Hidden by default using style="display: none;" -->
    <div class="result" id="result1" style="display: none;">
        <h5 style="color:rgb(100, 97, 156);"><b>Search Result</b></h5>
        <p style="color: rgb(187, 141, 239);"><b>Symbol:</b> <span id="symbol"></span></p>
        <p style="color: rgb(187, 141, 239);"><b>Name:</b> <span id="name"></span></p>
        <p style="color: rgb(187, 141, 239);"><b>Atomic Number:</b> <span id="number"></span></p>
        <p style="color: rgb(187, 141, 239);"><b>Atomic Mass:</b> <span id="mass"></span></p>
    </div>
    <br>

    <!--Connect Python File-->
    <script type="py" src="main.py"></script>
</div>
</body>
</html>
